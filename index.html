<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="General.css" />
  </head>

  <body>
    <main>
      <div class="switch-mode-btns-container">
        <button onclick="switchTo('focus')">Pomodoro</button>
        <button onclick="switchTo('shortbreak')">Shortbreak</button>
        <button onclick="switchTo('longbreak')">Longbreak</button>
      </div>

      <div class="displays-container">
        <h1 id="focus-display"></h1>
        <h1 id="shortbreak-display"></h1>
        <h1 id="longbreak-display"><p id="session-status"></p></h1>
      </div>

      <div class="operation-btns">
        <button onclick="pauseTimer()" id="pause-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="6" y="4" width="4" height="16" rx="1" />
            <rect x="14" y="4" width="4" height="16" rx="1" />
          </svg>
        </button>

        <button onclick="startTimer()" id="start-btn">Start</button>

        <button onclick="resetTimer()" id="reset-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>

      <hr class="horizontal-rule" />

      <div class="task-manager">
        <h5>CURRENT TASK</h5>

        <div class="task-list-container">
          <ul id="task-list" class="task-list"></ul>
        </div>

        <div class="add-task-conatainer">
          <input
            type="text"
            placeholder="Add a task..."
            id="input-box"
            class="input-box"
          />
          <button onclick="addTask()" id="add-task-btn" class="add-task-btn">
            Add
          </button>
        </div>
      </div>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
